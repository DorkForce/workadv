
<!doctype html>
<html>
  <meta charset="utf-8">
  <title>Sticky Notes Bridge</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#0f172a; color:#e5e7eb; }
    .btn { background:#1f2937; color:#e5e7eb; border:1px solid #374151; border-radius:8px; padding:.5rem .75rem; cursor:pointer; }
    .row { margin: .5rem 0; }
    small { color:#9ca3af; }
    code { background:#111827; padding:0 .25rem; border-radius:4px; }
  </style>
  <body>
    <h1>Sticky Notes Bridge</h1>
    <p>This page provides shared storage for the Sticky Notes bookmarklet via <code>postMessage</code>.</p>

    <div class="row">
      <button id="req" class="btn" type="button">Enable shared storage</button>
      <small>Uses <code>document.requestStorageAccess()</code> if available.</small>
    </div>
    <div class="row"><span id="status">Status: Initializing…</span></div>

    <script>
      (function(){
        const STATUS = document.getElementById('status');
        function setStatus(text, color) { STATUS.textContent = "Status: " + text; STATUS.style.color = color || '#e5e7eb'; }
        function pingParent(type, payload) { try { top.postMessage({ type, payload }, "*"); } catch(e) {} }

        // Storage helpers
        function safeGet(key) { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; } }
        function safeSet(key, payload) { try { localStorage.setItem(key, JSON.stringify(payload || [])); return true; } catch { return false; } }

        // Button to request storage access (requires user gesture)
        async function requestAccess() {
          if (document.requestStorageAccess) {
            try {
              await document.requestStorageAccess();
              // Set a test cookie & localStorage key to verify
              document.cookie = "snbridge=granted; path=/; max-age=31536000; SameSite=None; Secure";
              localStorage.setItem("__sn_bridge_access__", "granted");
              setStatus("Storage access granted", "#34d399");
              pingParent("sn_access_granted", { ok: true });
            } catch (e) {
              setStatus("Storage access denied: " + e.message, "#f87171");
              pingParent("sn_access_granted", { ok: false, error: e.message });
            }
          } else {
            setStatus("Storage Access API not available (fallback to partitioned storage)", "#fbbf24");
            pingParent("sn_access_granted", { ok: false, error: "API not available" });
          }
        }

        document.getElementById('req').addEventListener('click', requestAccess);

        // Message handling from bookmarklet
        window.addEventListener("message", (ev) => {
          const d = ev.data || {};
          if (d.type === "sn_ping") {
            setStatus("Ready (handshake ok)", "#34d399");
            pingParent("sn_ready", { ok: true });
          } else if (d.type === "sn_get") {
            const data = safeGet(d.key);
            pingParent("sn_get_ok", { payload: data });
          } else if (d.type === "sn_set") {
            const ok = safeSet(d.key, d.payload);
            pingParent("sn_set_ok", { ok });
          } else if (d.type === "sn_probe") {
            // Probe read/write capability
            const cookie = document.cookie || "";
            const ls = localStorage.getItem("__sn_bridge_access__");
            pingParent("sn_probe_ok", { cookiePresent: /snbridge=/.test(cookie), lsAccess: !!ls });
          }
        });

        // Announce ready if embedded directly
        setTimeout(() => { setStatus("Ready (awaiting handshake)"); pingParent("sn_ready", { ok: true }); }, 0);
      })();
    </script>
  </body>
</html>
